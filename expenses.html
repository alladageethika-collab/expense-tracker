<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expense Tracker — Expenses</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand-block">
        <div class="brand-mark">€</div>
        <div>
          <div class="brand-name">Expense Tracker</div>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="Sidebar navigation">
        <button type="button" class="nav-link-btn" data-route="dashboard.html">Dashboard</button>
        <button type="button" class="nav-link-btn active" data-route="expenses.html">Expenses</button>
        <button type="button" class="nav-link-btn" data-route="income.html">Income</button>
        <button type="button" class="nav-link-btn" data-route="budget.html">Budget</button>
      </nav>

      <div class="sidebar-footer">
        <div class="theme-section" aria-label="Theme selector">
          <div class="theme-label">Theme</div>
          <div class="theme-segmented" role="group" aria-label="Choose theme">
            <button id="theme-light" type="button" class="theme-option active" data-theme="light">Light</button>
            <button id="theme-dark" type="button" class="theme-option" data-theme="dark">Dark</button>
          </div>
        </div>
        <button id="logout-btn" class="logout-btn" type="button">Logout</button>
      </div>
    </aside>

    <main class="content-area">
      <header class="page-header">
        <div>
          <p class="eyebrow">Expense Management</p>
          <h1>Expenses</h1>
        </div>
      </header>

      <section class="panel" aria-labelledby="add-expense-heading">
        <h2 id="add-expense-heading">Add New Expense</h2>

        <form id="expense-form" autocomplete="off">
          <div class="form-row">
            <label for="description">Description</label>
            <input type="text" id="description" name="description" placeholder="e.g., Grocery shopping" required />
          </div>

          <div class="form-row">
            <label for="amount">Amount</label>
            <input type="number" id="amount" name="amount" placeholder="0.00" step="0.01" min="0" required />
          </div>

          <div class="form-row">
            <label for="category">Category</label>
            <select id="category" name="category">
              <option value="">-- Select category --</option>
              <option value="food">Food</option>
              <option value="transport">Transport</option>
              <option value="utilities">Utilities</option>
              <option value="entertainment">Entertainment</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="form-row">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" />
          </div>

          <div class="form-actions">
            <button type="submit">Add Expense</button>
            <button type="reset">Reset</button>
          </div>
        </form>
      </section>

      <section class="panel" aria-labelledby="expense-list-heading">
        <h2 id="expense-list-heading">Expense History</h2>

        <div class="table-controls">
          <label for="month-filter" class="visually-hidden">Filter by month</label>
          <select id="month-filter" aria-label="Filter by month">
            <option value="all">All Time</option>
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>

          <label for="year-filter" class="visually-hidden">Filter by year</label>
          <select id="year-filter" aria-label="Filter by year">
            <option value="all">All Time</option>
          </select>

          <label for="category-filter" class="visually-hidden">Filter by category</label>
          <select id="category-filter" aria-label="Filter expenses by category">
            <option value="all">All Categories</option>
            <option value="food">Food</option>
            <option value="transport">Transport</option>
            <option value="utilities">Utilities</option>
            <option value="entertainment">Entertainment</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="table-controls" style="margin-top: 0.75rem;">
          <label for="expense-search" class="visually-hidden">Search expenses</label>
          <input id="expense-search" type="text" placeholder="Search expenses" aria-label="Search expenses" style="width: 100%; max-width: 420px; padding: 0.6rem 0.75rem; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text);" />
        </div>

        <div class="table-wrap">
          <table id="expenses-table">
            <caption class="visually-hidden">List of expenses</caption>
            <thead>
              <tr>
                <th scope="col">Date</th>
                <th scope="col">Description</th>
                <th scope="col">Category</th>
                <th scope="col">Amount</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>

          <p id="no-expenses-message">No expenses recorded yet.</p>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
