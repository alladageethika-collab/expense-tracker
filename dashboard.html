<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expense Tracker — Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand-block">
        <div class="brand-mark">€</div>
        <div>
          <div class="brand-name">Expense Tracker</div>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="Sidebar navigation">
        <button type="button" class="nav-link-btn active" data-route="dashboard.html">Dashboard</button>
        <button type="button" class="nav-link-btn" data-route="expenses.html">Expenses</button>
        <button type="button" class="nav-link-btn" data-route="income.html">Income</button>
        <button type="button" class="nav-link-btn" data-route="budget.html">Budget</button>
      </nav>

      <div class="sidebar-footer">
        <div class="theme-section" aria-label="Theme selector">
          <div class="theme-label">Theme</div>
          <div class="theme-segmented" role="group" aria-label="Choose theme">
            <button id="theme-light" type="button" class="theme-option active" data-theme="light">Light</button>
            <button id="theme-dark" type="button" class="theme-option" data-theme="dark">Dark</button>
          </div>
        </div>
        <button id="logout-btn" class="logout-btn" type="button">Logout</button>
      </div>
    </aside>

    <main class="content-area">
      <header class="page-header">
        <div>
          <p class="eyebrow">Overview</p>
          <h1 id="welcome-message">Welcome back 👋</h1>
        </div>
      </header>

      <section class="cards" aria-label="Summary cards">
        <article class="card accent-indigo" id="total-balance">
          <div class="card-label">Total Balance</div>
          <div class="card-value amount">$0.00</div>
          <div class="card-note">Income minus expenses</div>
        </article>

        <article class="card accent-green" id="total-income">
          <div class="card-label">Total Income</div>
          <div class="card-value amount">$0.00</div>
          <div class="card-note">Income this period</div>
        </article>

        <article class="card accent-red" id="total-expenses">
          <div class="card-label">Total Expenses</div>
          <div class="card-value amount">$0.00</div>
          <div class="card-note">Expenses this period</div>
        </article>
      </section>

      <section class="charts-section" aria-labelledby="charts-heading">
        <div class="section-header">
          <h2 id="charts-heading">Financial Overview</h2>
        </div>

        <div class="chart-grid">
          <div class="chart-card panel">
            <h3>Expenses by Category</h3>
            <canvas id="expense-category-chart" aria-label="Expense by category chart"></canvas>
          </div>

          <div class="chart-card panel">
            <h3>Income vs Expense</h3>
            <canvas id="income-expense-chart" aria-label="Income versus expense chart"></canvas>
          </div>
        </div>
      </section>

      <section class="panel quick-links-panel" aria-labelledby="quick-links-heading">
        <div class="section-header">
          <h2 id="quick-links-heading">Quick Actions</h2>
        </div>

        <div class="quick-nav-grid">
          <button type="button" class="quick-nav-btn" data-route="expenses.html">Manage Expenses</button>
          <button type="button" class="quick-nav-btn" data-route="income.html">Manage Income</button>
          <button type="button" class="quick-nav-btn" data-route="budget.html">Manage Budget</button>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
