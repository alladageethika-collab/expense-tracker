<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up — Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <section aria-labelledby="signup-heading" class="card" style="max-width:480px; margin:3rem auto;">
      <h2 id="signup-heading">Create an account</h2>
      <p class="help-text">Sign up to store your data in this browser and access your dashboard.</p>

      <form id="signup-form" autocomplete="off">
        <div class="form-row">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" name="signup-email" placeholder="you@example.com" required />
        </div>

        <div class="form-row">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" name="signup-password" placeholder="Choose a password" required />
        </div>

        <div class="form-actions">
          <button type="submit">Sign up</button>
          <a href="login.html" class="action-btn" style="text-decoration:none;">Log in</a>
        </div>
      </form>

      <div class="divider" aria-hidden="true"><span>or</span></div>
      <button id="google-signup-btn" type="button" class="google-button">Continue with Google</button>

      <p class="help-text" style="margin-top:1rem;">This demo stores accounts locally in your browser. It is a client-side mock — not secure for real accounts.</p>
    </section>
  </main>
 
</body>
</html>
