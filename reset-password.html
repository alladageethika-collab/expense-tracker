<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Password — Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <section aria-labelledby="reset-password-heading" class="card" style="max-width:480px; margin:3rem auto;">
      <h2 id="reset-password-heading">Reset your password</h2>
      <p class="help-text">Enter and confirm your new password.</p>

      <form id="reset-password-form" autocomplete="off">
        <div class="form-row">
          <label for="new-password">New password</label>
          <input type="password" id="new-password" name="new-password" placeholder="Enter a new password" required />
        </div>

        <div class="form-row">
          <label for="confirm-password">Confirm password</label>
          <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your new password" required />
        </div>

        <div class="form-actions">
          <button type="submit">Update Password</button>
        </div>
      </form>

      <p id="reset-password-message" class="help-text" style="margin-top:1rem;"></p>
    </section>
  </main>
</body>
</html>
